syntax = "proto3";
package chat_link;
option csharp_namespace = "MirProto.ChatLink";

import "ds_game/sql_item_stackable_table.proto";
import "ds_game/sql_item_equipment_table.proto";
import "ds_game/sql_player_skill_table.proto";
import "ds_game/sql_weapon_skill_slot_table.proto";
import "_vector.proto";

message ChatLink {
  oneof items {
    chat_link.ChatPlayer player = 1;
    ds_game.SqlItemStackableTable stackable_item = 2;
    ds_game.SqlItemEquipmentTable equipment_item = 3;
    ds_game.SqlPlayerSkillTable player_skill = 4;
    ds_game.SqlWeaponSkillSlotTable character_skill = 5;
    chat_link.ChatBuff buff = 6;
    chat_link.ChatGroup group = 7;
    chat_link.ChatParty party = 8;
    chat_link.ChatLocation location = 9;
    chat_link.ChatEmote emote = 10;
  }
}
message ChatPlayer {
  string nickname = 1;
  int64 player_uid = 2;
  int32 game_server_index = 3;
  int32 world_id = 4;
}
message ChatBuff {
  int32 buff_id = 1;
}
message ChatGroup {
  string group_id = 1;
}
message ChatParty {
  int64 party_id = 1;
  int64 sender_uid = 2;
  int32 sender_level = 3;
  string sender_name = 4;
}
message ChatLocation {
  int32 island_id = 1;
  int32 indoor_group_id = 2;
  int32 floor = 3;
  Vector position = 4;
  optional string memo = 5;
}
message ChatEmote {
  int32 emote_id = 1;
}
