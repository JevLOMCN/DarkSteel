syntax = "proto3";
option csharp_namespace = "MirProto";


message ItemBuy {
  int32 shop_list_id = 1;
  int32 item_quantity = 2;
}
message ItemRepairInfo {
  int64 item_uid = 1;
  repeated int32 material_item_id = 2;
  repeated int32 material_item_quantity = 3;
}
message MountLostInfo {
  int64 list_id = 1;
  repeated int32 item_id = 2;
  repeated int32 quantity = 3;
  repeated int32 quantity_trade = 4;
  uint64 record_time = 5;
  uint64 end_time = 6;
}
