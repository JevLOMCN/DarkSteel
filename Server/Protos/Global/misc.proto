syntax = "proto3";
package misc;
option csharp_namespace = "MirProto.Misc";

import "google/protobuf/timestamp.proto";
import "_options.proto";
import "PkResultType.proto";
import "DirtyFlag.proto";

message PkHistoryRequest {
  int64 player_uid = 1;
  int64 target_player_uid = 2;
  int32 target_char_id = 3;
  string target_nickname = 4;
  int64 target_guild_uid = 5;
  int32 target_guild_icon = 6;
  string target_guild_name = 7;
  int32 target_char_level = 8;
  float target_combat_power = 9;
  google.protobuf.Timestamp current_time = 10;
  PkResultType pk_state = 11;
  int32 region_index = 12;
}
message MiscPlayerType {
  oneof item {
    int32 world_id = 1;
    google.protobuf.Timestamp login_dt = 2;
    google.protobuf.Timestamp logout_dt = 3;
    string nickname = 4;
    string player_session_uid = 5;
    int32 player_grade = 6;
    int32 main_char_id = 7;
    int32 main_char_level = 8;
    int32 main_char_skin = 9;
    float main_char_combat_power = 10;
    int32 player_icon = 11;
    uint32 island_id = 12;
    int32 game_server_index = 20;
    int64 guild_uid = 21;
    string guild_name = 22;
    int32 guild_icon = 23;
    int32 main_quest_id = 24;
    string custom_info = 25;
  }
}
message MiscPlayerMessage {
  DirtyFlag dirty_flag = 1;
  int64 player_uid = 2;
  int32 region_index = 3;
  repeated misc.MiscPlayerType values = 5;
  string ServerName = 10;
}
message Player {
  int64 player_uid = 1;
  string nickname = 2;
  int32 world_id = 3;
  int32 player_grade = 4;
  int32 region_index = 5;
  string player_session_uid = 6;
  google.protobuf.Timestamp login_dt = 8;
  google.protobuf.Timestamp logout_dt = 9;
  int64 guild_uid = 10;
  string guild_name = 11;
  int32 guild_icon = 12;
  uint32 island_id = 13;
  int32 game_server_index = 31;
  int32 main_char_id = 21;
  int32 main_char_level = 22;
  int32 main_char_skin = 23;
  float main_char_combat_power = 24;
  int32 player_icon = 25;
  int32 main_quest_id = 26;
  string custom_info = 27;
  string id = 30;
}
message PlayerList {
  repeated misc.Player players = 1;
}
message MiscGameOptionMessage {
  int64 player_uid = 1;
  int32 version = 2;
  google.protobuf.Timestamp update_dt = 3;
  string game_option = 4;
  string id = 5;
  int32 region_index = 6;
}
message PlayersByNameRequest {
  string nickname = 1;
  optional int32 region_index = 2;
}
message MiscMinimapMarkerMessage {
  int64 player_uid = 1;
  int32 region_index = 2;
  int32 version = 3;
  google.protobuf.Timestamp update_dt = 4;
  string minimap_marker = 5;
  string id = 6;
}
message NicknameMessage {
  string nickname = 1;
  int64 player_uid = 2;
  int32 region_index = 3;
  int32 world_id = 4;
  DirtyFlag dirty_flag = 10;
  string server_name = 100;
}
message NicknameData {
  string id = 1;
  int32 partition_key = 2;
  int64 player_uid = 3;
  int32 region_index = 4;
  int32 world_id = 5;
  string origin_nickname = 6;
}
message MiscBreachDataMessage {
  int32 island_id = 1;
  int64 player_uid = 2;
  int64 zone_id = 3;
  int32 breach_id = 4;
  int32 region_index = 5;
  string server_name = 100;
}
