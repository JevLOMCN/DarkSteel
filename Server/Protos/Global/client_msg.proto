message WeatherRequest {
  uint64 entity = 1;
}
message StopSkillMoveRequest {
  uint64 entity = 1;
  Vector position = 2;
  int32 skill_attack_id = 3;
  client_msg.StopSkillInfo stop_skill_info = 4;
}
message CharacterAvailableSkillRequest {
  repeated int32 skill_ids = 1;
}
message StopSkillInfo {
  Vector position = 1;
  double stop_time = 2;
}
message GimmickInteractionRequest {
  uint64 entity_id = 1;
  int32 interaction_id = 2;
}
message CharacterCustomHead {
  string head_type = 1;
  int32 head_color = 2;
  int32 face_type = 3;
  string hair_type = 4;
}
message CharacterCustomBody {
  string body_type = 1;
  int32 body_size = 2;
  int32 body_head_size = 3;
  int32 body_hand_size = 4;
  int32 body_foot_size = 5;
}
message CharacterCustomInfo {
  int32 gender = 1;
  int32 voice_type = 2;
  int32 skin_color = 4;
  float pitch = 5;
  client_msg.CharacterCustomHead head_info = 6;
  client_msg.CharacterCustomBody body_info = 7;
}
message CreateCharacterRequest {
  int64 player_uid = 1;
  string nickname = 2;
  int32 weapon = 3;
  client_msg.CharacterCustomInfo custom_info = 4;
}
message NetSyncRequest {
  Vector position = 1;
  VectorF direction = 2;
  VectorF velocity = 3;
  VelocityState velocity_state = 4;
  double ticks = 5;
  components.MoveMode move_mode = 6;
  SyncState sync_state = 7;
  float acceleration = 8;
  messages.MyTransport my_transport = 9;
  messages.FallingInfo falling_info = 10;
}
message NetSkillAttackSyncRequest {
  Vector position = 1;
  float direction = 2;
  VectorF velocity = 3;
  double ticks = 4;
  int64 skill_attack_id = 5;
  Vector predicted_arrival_position = 6;
}
message JoinContinentRequest {
  uint32 island_id = 1;
}
message LogoutRequest {
  LogoutReason logout_reason = 1;
}
message ChatRequest {
  string text = 1;
  ChattingType chatting_type = 2;
}
message CastSkillRequest {
  int32 skill_id = 1;
  Vector position = 2;
  float direction = 3;
  uint64 target_id = 4;
  double client_ticks = 5;
  messages.MultiTargetHitPoint multi_target_hit_point = 6;
  client_msg.StopSkillInfo stop_skill_info = 7;
  messages.ProjectileInfo projectile_info = 8;
}
message TerminateSkillRequest {
  int32 skill_id = 1;
}
message EffectBuffUpdateRequest {
  int32 effect_buff_type = 1;
  int32 effect_buff_add_value = 2;
}
message JoinMapReadyComplete {
  bool phantom = 1;
}
message MoveSyncRequest {
  Vector input_direction = 1;
  Vector input_rotation = 2;
  Vector position = 3;
  Vector rotation = 4;
  Vector direction = 5;
  double velocity = 6;
  double accelerate = 7;
  MoveState move_state = 8;
  double real_ticks = 9;
}
message HeightSyncRequest {
  double height = 1;
}
message TimeSyncRequest {
  double client_ticks = 1;
}
message GetAllCharactersRequest {
