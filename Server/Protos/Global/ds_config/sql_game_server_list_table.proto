syntax = "proto3";
package ds_config;
option csharp_namespace = "MirProto.DsConfig";

import "_db.proto";
import "google/protobuf/timestamp.proto";

message SqlGameServerListTable {
  int32 server_index = 1;
  int32 world_id = 2;
  int32 server_type = 3;
  int32 region_index = 4;
  int32 timezone_index = 5;
  string address = 6;
  string grpc_address = 7;
  string json = 8;
  int32 game_server_state = 9;
  google.protobuf.Timestamp game_server_refresh_dt = 10;
  int64 world_name_id = 11;
}
