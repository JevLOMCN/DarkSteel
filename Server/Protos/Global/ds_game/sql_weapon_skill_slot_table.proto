syntax = "proto3";
package ds_game;
option csharp_namespace = "MirProto.DsGame";

import "_db.proto";

message SqlWeaponSkillSlotTable {
  int64 player_uid = 1;
  int64 weapon_base_id = 2;
  int32 slot_index = 3;
  int32 selected_skill_id = 4;
  int32 skill_level = 5;
  int64 ascend_wait_complete_id = 8;
}
