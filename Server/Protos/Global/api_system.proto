syntax = "proto3";
package api_system;
option csharp_namespace = "MirProto.ApiSystem";

import "_api_common.proto";
import "google/protobuf/timestamp.proto";
import "AccountAuthority.proto";

message GetFrontEndServerAddrRequest {
  RequestBase request_base = 1;
  int32 world_id = 2;
  int64 player_uid = 3;
  string jwt_key = 4;
}
message GetFrontEndServerAddrResponse {
  ResponseBase response_base = 1;
  string addr = 2;
  int32 port = 3;
  int32 region_index = 4;
  AccountAuthority account_authority = 5;
}
message TencentUserSigRequest {
  RequestBase request_base = 1;
  int64 player_uid = 2;
}
message TencentUserSigResponse {
  ResponseBase response_base = 1;
  string user_sig = 2;
  uint32 sdk_app_id = 3;
}
message GetServerListInfoRequest {
  string player_id = 1;
}
message GetServerListInfoResponse {
  ResponseBase response_base = 1;
  repeated api_system.ServerListInfo table = 2;
}
message ServerListInfo {
  int32 world_id = 1;
  int32 region_index = 2;
  int32 timezone_index = 3;
  int32 server_type = 4;
  int32 game_server_state = 7;
  int64 world_name_id = 8;
  google.protobuf.Timestamp game_server_refresh_dt = 9;
  optional string name = 10;
}
