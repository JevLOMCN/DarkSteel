syntax = "proto3";
package ds_guild;
option csharp_namespace = "MirProto.DsGuild";

import "_db.proto";
import "google/protobuf/timestamp.proto";

message SqlGuildTable {
  int64 guild_uid = 1;
  string guild_name = 2;
  int64 master_player_uid = 3;
  string master_nickname = 4;
  string mark_info = 5;
  int32 member_count = 6;
  int64 gold = 7;
  int64 exp = 8;
  int32 level = 9;
  int32 disband_yn = 10;
  google.protobuf.Timestamp disband_time = 11;
  int32 kick_auto_type = 12;
  int32 recruit_type = 13;
  int32 recruit_level = 14;
  string recruit_message = 15;
  string notice = 16;
  google.protobuf.Timestamp reg_time = 25;
  google.protobuf.Timestamp update_time = 26;
}
