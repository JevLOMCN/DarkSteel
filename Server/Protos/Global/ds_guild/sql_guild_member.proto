syntax = "proto3";
package ds_guild;
option csharp_namespace = "MirProto.DsGuild";

import "_db.proto";
import "GuildRoleType.proto";
import "google/protobuf/timestamp.proto";
import "GuildMemberGradeType.proto";

message SqlGuildMemberTable {
  int64 guild_uid = 1;
  int64 player_uid = 2;
  GuildMemberGradeType grade = 3;
  google.protobuf.Timestamp reg_time = 4;
  google.protobuf.Timestamp update_time = 5;
}
