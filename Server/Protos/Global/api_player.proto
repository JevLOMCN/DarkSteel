syntax = "proto3";
option csharp_namespace = "MirProto";

import "ErrorCode.proto";

message CreateNicknameServiceBusRequest {
  string queue_name = 10;
  int64 player_uid = 11;
  string nickname = 12;
  int32 game_server_index = 13;
  int32 weapon = 14;
  string custom = 15;
  int32 region_index = 17;
  int32 world_id = 18;
  uint64 player_entity = 19;
}
message CreateNicknameServiceBusResponse {
  ErrorCode error_code = 1;
  string queue_name = 10;
  int64 player_uid = 11;
  string nickname = 12;
  int32 game_server_index = 13;
  int32 weapon = 14;
  string custom = 15;
  int32 region_index = 17;
  int32 world_id = 18;
  uint64 player_entity = 19;
}
