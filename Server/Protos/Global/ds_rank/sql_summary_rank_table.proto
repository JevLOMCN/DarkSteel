syntax = "proto3";
package ds_rank;
option csharp_namespace = "MirProto.DsRank";

import "_db.proto";

message SqlSummaryRankTable {
  int64 world_id = 1;
  int32 rank_type = 2;
  int64 player_uid = 3;
  int64 reward_rank = 4;
  int64 unique_param = 5;
  int64 current_score = 6;
  bool is_reward = 7;
}
