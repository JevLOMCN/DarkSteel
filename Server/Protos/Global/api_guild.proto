    api_guild.CancelJoinGuildResponse cancel_join_guild_res = 22;
    api_guild.UpdateGuildMarkResponse update_guild_mark_res = 23;
    api_guild.UpdateGuildNameResponse update_guild_name_res = 24;
    api_guild.UpdateGuildSettingResponse update_guild_setting_res = 25;
    api_guild.ChangeGuildMoneyResponse change_guild_money_res = 30;
    api_guild.ChangeGuildCombatPowerResponse change_guild_combat_power_res = 31;
