message CosmosGuildType {
  oneof item {
    string nickname = 2;
    int32 level = 3;
    uint32 zone_id = 4;
    bool is_logged_in = 5;
    google.protobuf.Timestamp logout_dt = 6;
  }
}
message CosmosGuildTypeList {
  int64 player_uid = 1;
  repeated api_guild.CosmosGuildType list = 2;
}
message CosmosGuildMessage {
  DirtyFlag dirty_flag = 1;
  int64 guild_uid = 2;
  bool is_disband = 3;
