}
message NotifyGuildMessage {
  oneof item {
    api_guild.NotifyCreateGuildMessage notify_create_guild_msg = 1;
    api_guild.NotifyGuildMemberAddMessage notify_guild_member_add_msg = 10;
    api_guild.NotifyJoinGuildMessage notify_join_guild_msg = 11;
    api_guild.NotifyGuildMemberRemoveMessage notify_guild_member_remove_msg = 12;
    api_guild.NotifyGuildUpdateMessage notify_guild_update_msg = 13;
    api_guild.NotifyGuildMemberUpdateMessage notify_guild_member_update_msg = 14;
  }
