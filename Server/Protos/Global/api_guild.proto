  api_guild.GuildMemberRes guild_member_res = 2;
}
message NotifyGuildMemberAddMessage {
  api_guild.GuildRes guild_res = 1;
  api_guild.GuildMemberRes guild_member_res = 2;
}
message NotifyJoinGuildMessage {
  api_guild.GuildRes guild_res = 1;
  api_guild.GuildMemberRes guild_member_res = 2;
}
