syntax = "proto3";
package ds_world;
option csharp_namespace = "MirProto.DsWorld";

import "_db.proto";
import "google/protobuf/timestamp.proto";

message SqlBreachHistoryTable {
  int32 zone_id = 1;
  int32 breach_id = 2;
  int32 success_count = 3;
  string first_clear_player = 4;
  google.protobuf.Timestamp last_update_dt = 5;
}
