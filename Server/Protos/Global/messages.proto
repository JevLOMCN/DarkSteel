syntax = "proto3";
package messages;
option csharp_namespace = "MirProto.Messages";

import "_options.proto";
import "_vector.proto";
import "PkModeType.proto";

message FrontEndClientSession {
  int32 server_index = 1;
  uint64 client_session_id = 2;
}
message PlayerEntity {
  uint64 bits = 1;
}
message MainCharacter {
  uint64 bits = 1;
}
message SubCharacter {
  uint64 bits = 1;
}
message ServerSession {
  uint32 id = 1;
}
message None {
  bool phantom_data = 1;
}
message All {
  bool phantom_data = 1;
}
message Target {
  messages.PlayerEntity player_entity = 1;
  messages.FrontEndClientSession front_end_client_session = 2;
}
message MyTransport {
  uint64 transport_entity_id = 1;
  Vector relative_position = 2;
}
message FallingInfo {
  float height = 1;
}
message PkSpawnInfo {
  PkModeType pk_mode_type = 1;
  int32 criminal_point = 2;
  int64 recent_first_attack_player_uid = 3;
  double recent_first_attack_valid_real_ticks = 4;
  double my_player_uid_first_attack_valid_real_ticks = 5;
}
message CharacterEntityType {
  oneof entity {
    messages.MainCharacter main = 1;
    messages.SubCharacter sub = 2;
  }
}
message MultiTargetHitPoint {
  Vector target_move_reference_position = 1;
  float hit_capsule_radius = 2;
  int32 hit_point_index = 3;
}
message SlotDeck {
  int32 deck_index = 1;
  int32 slot_index = 2;
}
message LocationType {
  int32 id = 1;
  Vector position = 2;
  float direction = 3;
}
message ServerChangeType {
  oneof item {
    messages.LocationType zone_island = 1;
    messages.LocationType warp_location = 2;
    messages.LocationTransportType transport_location = 3;
  }
}
message LocationTransportType {
  int32 id = 1;
  Vector position = 2;
  float direction = 3;
  uint64 transport_entity = 4;
  messages.LocationType fail_location = 5;
}
message ProjectileInfo {
  float impact_delay_sec = 1;
  Vector target_position = 2;
  Vector aim_position = 3;
}
message InteractionNpcType {
  uint64 npc_entity_id = 3;
}
message InteractionStuffType {
  uint64 stuff_entity_id = 3;
}
